<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Zombie Chase v3.0 — Outbreak Protocol</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800&family=JetBrains+Mono:wght@600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <!-- PERIPHERAL TACTICAL HUD (Zero Center-Screen Banner Clutter!) -->
    <div id="hud-root">
      <!-- TOP-LEFT: Horde Telemetry, District Biome, Viral Combo & Caste Breakdown -->
      <aside class="hud-panel hud-top-left">
        <div class="brand-row">
          <span class="brand-badge">OUTBREAK v3.0</span>
          <span id="hud-threat-stars" class="threat-stars" title="Military Escalation Level">★☆☆☆☆</span>
          <div class="top-action-btns">
            <button id="btn-light-mode" class="light-mode-btn" title="Cycle Lighting Preset (Key N)">
              [N] BIO-NOIR NIGHT
            </button>
            <button id="btn-summon-boss" class="light-mode-btn btn-boss-trigger" title="Deploy Hunter-Killer Titan Boss (Key B)">
              [B] BOSS
            </button>
            <button id="btn-open-lab" class="light-mode-btn btn-lab-trigger" title="Open Persistent Mutation Lab (Key M)">
              [M] LAB
            </button>
          </div>
        </div>

        <div class="sector-row">
          <span id="hud-district-badge" class="district-badge">DOWNTOWN FINANCIAL CORE</span>
          <span id="hud-combo-badge" class="combo-badge hidden">VIRAL CHAIN x2</span>
        </div>

        <div class="metrics-grid">
          <div class="metric-card metric-emerald">
            <span class="metric-label">ACTIVE HORDE</span>
            <span id="hud-horde-count" class="metric-value">7</span>
          </div>
          <div class="metric-card metric-cyan">
            <span class="metric-label">MUTAGEN DNA</span>
            <span id="hud-dna-count" class="metric-value">80</span>
          </div>
          <div class="metric-card metric-amber">
            <span class="metric-label">BREACHED</span>
            <span id="hud-breach-count" class="metric-value">0</span>
          </div>
          <div class="metric-card metric-slate">
            <span class="metric-label">BIOMASS SCORE</span>
            <span id="hud-score-count" class="metric-value">0</span>
          </div>
        </div>

        <!-- Live Evolved Caste Telemetry Pills -->
        <div class="caste-strip">
          <div class="caste-pill caste-walker" title="Standard Shambler Walkers">
            <span class="caste-dot"></span>
            <span class="caste-name">WALKERS</span>
            <strong id="caste-walker-count">3</strong>
          </div>
          <div class="caste-pill caste-leaper" title="Crimson Leapers — Pounce over obstacles onto sprinters">
            <span class="caste-dot"></span>
            <span class="caste-name">LEAPERS</span>
            <strong id="caste-leaper-count">1</strong>
          </div>
          <div class="caste-pill caste-brute" title="Juggernaut Brutes — Smash glass storefronts & flip cars">
            <span class="caste-dot"></span>
            <span class="caste-name">BRUTES</span>
            <strong id="caste-brute-count">1</strong>
          </div>
          <div class="caste-pill caste-spitter" title="Volatile Spitters — Lob infectious acid spore artillery">
            <span class="caste-dot"></span>
            <span class="caste-name">SPITTERS</span>
            <strong id="caste-spitter-count">1</strong>
          </div>
        </div>

        <!-- Boss Encounter Health Bar (Only visible when Hunter-Killer Titan is active) -->
        <div id="hud-boss-panel" class="boss-telemetry hidden">
          <div class="boss-header">
            <span class="boss-title">HUNTER-KILLER TITAN MECH</span>
            <span id="hud-boss-hp-text" class="boss-hp-text">PHASE 1 • 1200 HP</span>
          </div>
          <div class="boss-bar-track">
            <div id="hud-boss-bar-fill" class="boss-bar-fill"></div>
          </div>
        </div>
      </aside>

      <!-- TOP-RIGHT: Tactical Radar Minimap + Non-Intrusive Comms Ticker -->
      <aside class="hud-panel hud-top-right">
        <div class="radar-frame">
          <canvas id="hud-radar-canvas" width="156" height="156"></canvas>
          <div class="radar-legend">
            <span><i class="leg-box leg-room"></i>BREACH LAB/MALL</span>
            <span><i class="leg-box leg-dna"></i>DNA</span>
          </div>
        </div>
        <div id="hud-radio-feed" class="radio-feed"></div>
      </aside>

      <!-- PERSISTENT MUTATION LAB MODAL ([M] Key) -->
      <div id="mutation-lab-modal" class="lab-modal hidden">
        <div class="lab-card hud-panel">
          <div class="lab-header">
            <div>
              <h2>GENOME MUTATION LAB</h2>
              <p id="lab-banked-dna" class="lab-dna-sub">200 DNA AVAILABLE</p>
            </div>
            <button id="btn-close-lab" class="lab-close-btn">✕ ESC</button>
          </div>
          <div class="lab-grid">
            <button id="btn-lab-pack" class="lab-upgrade-btn">
              <strong>BROOD INCUBATION</strong>
              <span>Spawns extra Crimson Leapers &amp; Juggernaut Brutes at the start of every outbreak</span>
              <em class="lab-cost">LV.1 • UPGRADE (60 DNA)</em>
            </button>
            <button id="btn-lab-viral" class="lab-upgrade-btn">
              <strong>VIRAL INCUBATOR</strong>
              <span>Extends the Viral Chain Combo Multiplier window (+0.8s per level)</span>
              <em class="lab-cost">LV.1 • UPGRADE (60 DNA)</em>
            </button>
            <button id="btn-lab-carapace" class="lab-upgrade-btn">
              <strong>CHITIN BIO-CARAPACE</strong>
              <span>Increases Patient Zero &amp; Horde Caste armor durability against Snipers &amp; APCs</span>
              <em class="lab-cost">LV.1 • UPGRADE (60 DNA)</em>
            </button>
          </div>
        </div>
      </div>

      <!-- BOTTOM-CENTER: Tactical Horde Command & Live Genome Evolution Dock -->
      <footer class="hud-bottom-dock">
        <div class="command-group">
          <button id="cmd-frenzy" class="cmd-btn cmd-frenzy">
            <div class="cmd-header">
              <span class="cmd-key">SPACE</span>
              <span class="cmd-title">FRENZY ROAR</span>
            </div>
            <div class="cmd-bar-track">
              <div id="bar-frenzy" class="cmd-bar-fill"></div>
            </div>
            <span id="status-frenzy" class="cmd-status">READY</span>
          </button>

          <button id="cmd-surge" class="cmd-btn cmd-surge">
            <div class="cmd-header">
              <span class="cmd-key">RMB / Q</span>
              <span class="cmd-title">HORDE SURGE</span>
            </div>
            <div class="cmd-bar-track">
              <div id="bar-surge" class="cmd-bar-fill"></div>
            </div>
            <span id="status-surge" class="cmd-status">AIM CURSOR &amp; SURGE</span>
          </button>

          <button id="cmd-formation" class="cmd-btn cmd-formation">
            <div class="cmd-header">
              <span class="cmd-key">E</span>
              <span class="cmd-title">FORMATION</span>
            </div>
            <div id="label-formation" class="formation-badge">SWARM</div>
            <span class="cmd-status">SWARM / SHIELD / PINCER</span>
          </button>
        </div>

        <div class="dock-divider"></div>

        <div class="evo-group">
          <button id="evo-leaper" class="evo-btn evo-crimson">
            <div class="evo-top">
              <span class="cmd-key">1</span>
              <span class="evo-title">+LEAPER GENE</span>
            </div>
            <span class="evo-desc">Airborne Pounce Hunters</span>
            <span class="evo-meta">LV.1 • 35 DNA</span>
          </button>

          <button id="evo-brute" class="evo-btn evo-amber">
            <div class="evo-top">
              <span class="cmd-key">2</span>
              <span class="evo-title">+BRUTE CARAPACE</span>
            </div>
            <span class="evo-desc">Breach Glass &amp; Flip Cars</span>
            <span class="evo-meta">LV.1 • 45 DNA</span>
          </button>

          <button id="evo-spitter" class="evo-btn evo-lime">
            <div class="evo-top">
              <span class="cmd-key">3</span>
              <span class="evo-title">+SPITTER ACID</span>
            </div>
            <span class="evo-desc">Bio-Artillery &amp; Spore Cloud</span>
            <span class="evo-meta">LV.1 • 40 DNA</span>
          </button>

          <button id="evo-alpha" class="evo-btn evo-emerald">
            <div class="evo-top">
              <span class="cmd-key">4</span>
              <span class="evo-title">+ALPHA STRAIN</span>
            </div>
            <span class="evo-desc">Swarm Speed &amp; Overdrive</span>
            <span class="evo-meta">LV.1 • 50 DNA</span>
          </button>
        </div>
      </footer>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
