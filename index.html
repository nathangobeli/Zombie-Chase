<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <title>Zombie Chase</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700;800;900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <canvas id="game-canvas"></canvas>

    <!-- MINIMALIST MOBILE-FIRST ARCADE HUD (92% of screen is 100% open!) -->
    <div id="hud-root">
      <!-- Slim Top Pill Bar -->
      <header class="top-bar">
        <div class="stat-pill stat-horde">
          <span class="stat-icon">🧟</span>
          <div class="stat-text">
            <span class="stat-label">HORDE</span>
            <strong id="hud-horde-count">7</strong>
          </div>
        </div>

        <div class="stat-pill stat-score">
          <span class="stat-icon">⭐</span>
          <div class="stat-text">
            <span class="stat-label">SCORE</span>
            <strong id="hud-score-count">0</strong>
          </div>
        </div>

        <div id="hud-combo-badge" class="combo-pill hidden">🔥 x2</div>

        <button id="btn-light-mode" class="icon-btn" title="Toggle Day / Sunset Lighting">
          ☀️
        </button>
      </header>

      <!-- Slim Boss HP Bar (Only appears during Boss fight) -->
      <div id="hud-boss-panel" class="boss-bar-wrap hidden">
        <div class="boss-bar-label">
          <span>BOSS TANK</span>
          <span id="hud-boss-hp-text">100%</span>
        </div>
        <div class="boss-bar-track">
          <div id="hud-boss-bar-fill" class="boss-bar-fill"></div>
        </div>
      </div>

      <!-- On-Screen Touch Joystick Indicator (Only visible while finger is dragging) -->
      <div id="touch-joystick-base" class="joystick-base hidden">
        <div id="touch-joystick-knob" class="joystick-knob"></div>
      </div>

      <!-- Thumb-Friendly Bottom-Right Arcade Action Buttons -->
      <div class="action-buttons">
        <button id="cmd-surge" class="arcade-btn btn-surge" aria-label="Horde Surge">
          <span class="btn-emoji">💥</span>
          <span class="btn-name">SURGE</span>
          <span id="status-surge" class="btn-sub">READY</span>
        </button>

        <button id="cmd-frenzy" class="arcade-btn btn-frenzy" aria-label="Frenzy Roar">
          <span class="btn-emoji">⚡</span>
          <span class="btn-name">FRENZY</span>
          <span id="status-frenzy" class="btn-sub">READY</span>
        </button>
      </div>
    </div>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
